name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install project
        run: python -m pip install --editable ".[pdfium,dev]"

      - name: Run tests
        run: pytest

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Import installed package
        run: python -c "from pdf2pixels import PageImage, convert"
