[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2pixels"
version = "0.1.0"
description = "Stream PDF pages as images through interchangeable rendering backends."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pdf", "pdf-to-image", "pdfium", "poppler", "png", "jpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mclint/pdf2pixels"
Repository = "https://github.com/mclint/pdf2pixels"
Issues = "https://github.com/mclint/pdf2pixels/issues"

[project.optional-dependencies]
pdfium = [
    "Pillow>=10.1",
    "pypdfium2>=5.0",
]
examples = [
    "jupyterlab>=4",
]
dev = [
    "build",
    "hatchling",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2pixels"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pdf2pixels"]
strict = true
