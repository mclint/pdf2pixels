[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2pixels"
version = "0.1.0"
description = "Stream PDF pages as images through interchangeable rendering backends."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
pdfium = ["pypdfium2"]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2pixels"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["pdf2pixels"]
strict = true

