[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2pixels"
version = "0.1.0"
description = "Stream PDF pages as images through interchangeable rendering backends."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
pdfium = [
    "Pillow>=10.1",
    "pypdfium2>=5.0",
]
dev = [
    "build",
    "hatchling",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2pixels"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pdf2pixels"]
strict = true
